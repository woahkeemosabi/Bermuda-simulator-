<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#061820" />
	<meta name="description" content="Bermuda Simulator — explore a living island world by land, boat and sea." />
	<title>Bermuda Simulator</title>
	<link rel="preload" as="image" type="image/jpeg" href="ui/bermuda-loading.jpg" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat+Brush&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/src/ui/ui.css" />
	<link rel="stylesheet" href="/src/ui/mobile-boat.css" />
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#app, #app canvas { display: block; }
		#fps { position: fixed; top: 10px; left: 12px; z-index: 50; font: 500 12px/1.2 'JetBrains Mono', ui-monospace, monospace;
			color: #e8f6ff; background: rgba(8, 14, 22, 0.55); padding: 5px 9px; border-radius: 6px; pointer-events: none;
			backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); letter-spacing: 0.02em; }
	</style>
</head>
<body>
	<div id="app"></div>
	<div id="fps">-- fps</div>
	<div id="loader" class="bm-new-loader" role="status" aria-live="polite" aria-label="Loading Bermuda Simulator">
		<img class="loader-art is-in" src="ui/bermuda-loading.jpg" alt="Bermuda Simulator — explore, drive, dive and discover" decoding="async" fetchpriority="high" />
		<div class="loader-scrim"></div>
		<div class="loader-inner">
			<div class="loader-panel">
				<div class="loader-row">
					<span class="loader-status">Preparing the island…</span>
					<span class="loader-meta"><span class="loader-pct">0%</span><span class="loader-time">0:00</span></span>
				</div>
				<div class="loader-bar"><div class="loader-fill"></div><div class="loader-glint"></div></div>
				<div class="loader-note">Preparing Bermuda for exploration</div>

			</div>
		</div>
	</div>
	<script type="module">
		// Simple browser baseline: remove the old offline/PWA worker and its asset caches without
		// touching localStorage, so player money/progression remain intact.
		if ( 'serviceWorker' in navigator ) {
			try {
				const registrations = await navigator.serviceWorker.getRegistrations();
				const wasControlled = !!navigator.serviceWorker.controller;
				if ( registrations.length || wasControlled ) {
					// Publish/activate the self-cleaning worker immediately so an older Bermuda worker
					// cannot keep serving a mixed cached build.
					try {
						const cleanup = await navigator.serviceWorker.register('./sw.js', { scope:'./', updateViaCache:'none' });
						await cleanup.update();
					} catch ( _ ) {}
					await Promise.all( registrations.map( registration => registration.unregister().catch( () => false ) ) );
					if ( 'caches' in window ) {
						const keys = await caches.keys();
						await Promise.all( keys.map( key => caches.delete( key ) ) );
					}
					if ( wasControlled && !sessionStorage.getItem('bermuda-simple-browser-reloaded') ) {
						sessionStorage.setItem('bermuda-simple-browser-reloaded','1');
						location.reload();
						await new Promise( () => {} );
					}
				}
			} catch ( error ) {
				console.warn( 'Legacy offline cleanup skipped; continuing with normal browser launch', error );
			}
		}
		await import('/src/runtime/MobileVehicleHandling.js');
		await import('/src/main.js');
	</script>
</body>
</html>
