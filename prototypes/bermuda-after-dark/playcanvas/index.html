<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#22243b"><title>Bermuda After Dark | PlayCanvas Engine Trial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#242740;color:#fff;font:13px monospace;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;text-shadow:2px 2px #161525;pointer-events:none}#hud span{background:#22253cba;padding:7px 10px;border:1px solid #8795a3}#message{position:fixed;top:65px;left:12px;right:12px;text-align:center;background:#202237b8;padding:8px;pointer-events:none}#controls{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}#pad{display:grid;grid-template-columns:repeat(3,48px);gap:4px}button{background:#26344fcf;border:2px solid #9ea5ac;color:white;border-radius:8px;width:48px;height:48px;font:18px monospace;touch-action:none}#act{width:76px;height:64px}#error{position:fixed;left:10px;right:10px;top:35%;padding:16px;background:#301b29;display:none;white-space:pre-wrap}
