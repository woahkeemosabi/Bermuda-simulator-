<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bermuda After Dark — Prototype 01</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#10131e;color:#f4e8cf;font:14px monospace;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;text-shadow:2px 2px #151422}#hud span{background:#16182bcc;padding:8px;border:2px solid #69718c}#dialog{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:550px;margin:auto;padding:12px;background:#11172eea;border:3px solid #b3b2a0;line-height:1.5;pointer-events:none}#controls{position:fixed;bottom:calc(15px + env(safe-area-inset-bottom));left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}button{pointer-events:auto;background:#1b2848dc;color:white;border:2px solid #b8c2ce;border-radius:9px;font:bold 17px monospace;min-width:52px;min-height:49px;touch-action:none}#dpad{display:grid;grid-template-columns:repeat(3,52px);gap:3px}#action{width:90px;height:65px}#note{position:fixed;top:70px;left:12px;right:12px;text-align:center;color:#fff5d6;font-size:11px;pointer-events:none}</style></head><body><canvas id="game" width="320" height="480"></canvas><div id="hud"><span>BERMUDA AFTER DARK</span><span id="state">DOCK</span></div><div id="note">Prototype 01 · 2D gameplay test · Tidewater ocean not yet connected</div><div id="dialog">Find the dockkeeper. Use the arrows to move and ACT to interact.</div><div id="controls"><div id="dpad"><i></i><button data-key="ArrowUp">▲</button><i></i><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="action">ACT</button></div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),dialog=document.querySelector('#dialog'),status=document.querySelector('#state');const keys=new Set();let player={x:100,y:275},boat={x:220,y:275},mode='dock',quest=0,elapsed=0,flash=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function text(t,x,y,c='#fff',sz=9){ctx.fillStyle=c;ctx.font='bold '+sz+'px monospace';ctx.fillText(t,x,y)}function wave(y,phase){for(let x=0;x<320;x+=8){const d=Math.sin(x*.06+phase)*3+Math.sin(x*.13-phase*.7)*2;rect(x,y+d,7,2,'#58a7a8')}}function draw(){const t=elapsed*.001;rect(0,0,320,480,'#343b60');rect(0,80,320,400,'#216477');for(let y=100;y<480;y+=27)wave(y,t+y*.08);rect(0,90,320,8,'#5b8490');for(let i=0;i<9;i++){const x=i*40-12;rect(x,82,28,9,i%2?'#9f8e84':'#bdab9a')}if(mode==='dock'){rect(0,170,180,235,'#735a53');for(let y=175;y<405;y+=16){rect(0,y,180,2,'#3d3441')}for(let x=12;x<180;x+=28)rect(x,170,3,235,'#9e7d67');rect(15,105,115,66,'#ba7890');rect(20,115,105,56,'#d39fa3');rect(30,130,32,41,'#34405c');rect(73,133,42,20,'#34405c');text('DOCKKEEPER',19,102,'#ffe6c4');rect(63,212,13,18,'#443a45');rect(65,202,9,12,'#c68d68');text('!',68,195,'#f9e68b',13);rect(boat.x-25,boat.y-12,50,27,'#d6c8b2');rect(boat.x-15,boat.y-17,30,8,'#486079');rect(boat.x+8,boat.y-6,7,7,'#a13c4a');text('BOAT',boat.x-15,boat.y+26);rect(player.x-5,player.y-10,10,17,'#e4d3a8');rect(player.x-4,player.y-16,8,8,'#704d42');rect(player.x-5,player.y+7,4,6,'#242a40');rect(player.x+1,player.y+7,4,6,'#242a40')}else{rect(boat.x-23,boat.y-11,46,24,'#d4c6b5');rect(boat.x-13,boat.y-17,26,9,'#4b5164');rect(boat.x-3,boat.y-22,5,9,'#c2a58c');rect(boat.x-7,boat.y+2,14,6,'#a7a7a0');rect(265,135,18,36,'#777780');rect(259,127,30,10,'#c4c0aa');rect(271,112,6,16,Math.sin(t*4)>0?'#e6c879':'#a75459');text('BEACON',244,105);if(mode==='beacon')text('SIGNAL FOUND',115,250,'#ffe5a5')}if(flash>0){rect(0,0,320,480,'#ffffff22');flash--}requestAnimationFrame(()=>{})}function action(){if(mode==='dock'){if(Math.hypot(player.x-69,player.y-213)<55){quest=Math.max(quest,1);dialog.textContent='DOCKKEEPER: The offshore beacon has been flashing since midnight. Take the boat and investigate.';flash=10}else if(Math.hypot(player.x-boat.x,player.y-boat.y)<70){if(!quest){dialog.textContent='Talk to the dockkeeper first.';return}mode='sea';boat.x=95;boat.y=275;status.textContent='AT SEA';dialog.textContent='Pilot east toward the flashing beacon. ACT when close.'}else dialog.textContent='Move closer to the dockkeeper or boat.'}else if(mode==='sea'&&boat.x>230&&boat.y<210){mode='beacon';quest=2;status.textContent='SIGNAL';dialog.textContent='A weathered radio repeats coordinates. You found the first clue! ACT to return to the dock.';flash=18}else if(mode==='beacon'){mode='dock';player={x:220,y:310};boat={x:220,y:275};status.textContent='COMPLETE';dialog.textContent='MISSION COMPLETE: The signal is only the beginning. Prototype 01 complete.'}else dialog.textContent='Get closer to the offshore beacon (upper right).'}function update(dt){elapsed+=dt;const speed=dt*.095;let dx=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0),dy=(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0);if(dx||dy){const n=Math.hypot(dx,dy);if(mode==='dock'){player.x=clamp(player.x+dx/n*speed,14,300);player.y=clamp(player.y+dy/n*speed,178,395)}else if(mode==='sea'){boat.x=clamp(boat.x+dx/n*speed*.8,20,300);boat.y=clamp(boat.y+dy/n*speed*.8,105,450)}}draw()}let last=performance.now();function frame(now){const dt=Math.min(now-last,50);last=now;update(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});document.querySelector('#action').addEventListener('pointerdown',e=>{e.preventDefault();action()});addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys.add(e.key);e.preventDefault()}if(e.key===' '||e.key==='Enter')action()});addEventListener('keyup',e=>keys.delete(e.key));
</script></body></html>
