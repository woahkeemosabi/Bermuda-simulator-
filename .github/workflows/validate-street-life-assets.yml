name: Validate Bermuda Street Life Assets

on:
  push:
    paths:
      - 'public/models/bermuda/street-life/**/*.glb'
      - '.github/workflows/validate-street-life-assets.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect GLB contracts and gameplay budgets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct, glob, sys

          errors=[]
          for path in sorted(glob.glob('public/models/bermuda/street-life/**/*.glb', recursive=True)):
              with open(path,'rb') as f: data=f.read()
              if data[:4] != b'glTF':
                  errors.append(f'{path}: bad magic'); continue
              version,total=struct.unpack_from('<II',data,4)
              off=12; doc=None
              while off < total:
                  n,typ=struct.unpack_from('<II',data,off); chunk=data[off+8:off+8+n]; off += 8+n
                  if typ == 0x4E4F534A: doc=json.loads(chunk.decode('utf-8').rstrip('\x00 '))
              if not doc:
                  errors.append(f'{path}: no JSON'); continue
              req=doc.get('extensionsRequired',[]); used=doc.get('extensionsUsed',[])
              mats=len(doc.get('materials',[])); skins=len(doc.get('skins',[])); anim=len(doc.get('animations',[]))
              tris=0
              for mesh in doc.get('meshes',[]):
                  for p in mesh.get('primitives',[]):
                      if p.get('mode',4) != 4: errors.append(f'{path}: non-triangle primitive')
                      if 'indices' in p: tris += doc['accessors'][p['indices']]['count']//3
                      elif 'POSITION' in p.get('attributes',{}): tris += doc['accessors'][p['attributes']['POSITION']]['count']//3
              image_types=[im.get('mimeType','uri') for im in doc.get('images',[])]
              texture_sources=[]
              for t in doc.get('textures',[]):
                  ext=t.get('extensions',{}).get('EXT_texture_webp',{})
                  texture_sources.append(ext.get('source',t.get('source')))
              print(json.dumps({
                  'file':path,'bytes':len(data),'version':version,'triangles':tris,
                  'materials':mats,'skins':skins,'animations':anim,
                  'extensionsRequired':req,'extensionsUsed':used,
                  'images':image_types,'textureSources':texture_sources,
              }, separators=(',',':')))
              if skins or anim: errors.append(f'{path}: static loader cannot accept skins/animations')
              if mats > 4: errors.append(f'{path}: material budget {mats} > 4')
              unsupported=[x for x in req if x not in ('EXT_texture_webp',)]
              if unsupported: errors.append(f'{path}: unsupported required extensions {unsupported}')

              mobile='/mobile/' in path
              scooter=path.endswith('/bermuda-scooter.glb')
              limit = (36000 if scooter else 26000) if mobile else (115000 if scooter else 68000)
              if tris > limit: errors.append(f'{path}: triangle budget {tris} > {limit}')

          if errors:
              print('VALIDATION ERRORS:', file=sys.stderr)
              for e in errors: print(' - '+e,file=sys.stderr)
              sys.exit(1)
          PY
