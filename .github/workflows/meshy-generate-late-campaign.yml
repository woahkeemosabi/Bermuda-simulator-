name: Generate Late Campaign Meshy Assets

on:
  push:
    paths:
      - '.github/workflows/meshy-generate-late-campaign.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshy-late-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Meshy auth and cost preflight
        shell: bash
        run: |
          set -euo pipefail
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          mkdir -p .meshy-late/estimates
          $M auth status --output-schema v1 --format json --no-update-check | tee .meshy-late/auth.json

          names=(
            blue-hole-component
            limestone-door
            red-room-console
          )
          prompts=(
            "Game-ready mysterious artificial component recovered from a Bermuda blue hole, compact dark titanium alloy housing with an asymmetric readable silhouette, restrained amber luminous slit, mineral and salt-water wear, clearly manufactured but enigmatic, isolated prop with no ground plane, no text, optimized mobile open-world game asset"
            "Game-ready submerged secret limestone doorway for a Bermuda underwater cave, pale weathered natural limestone frame fused around a precise dark engineered portal and recessed sealed door, small amber locator lights, believable salt-water aging, front-facing readable doorway, isolated modular environment prop, no terrain or water plane, optimized mobile game asset"
            "Game-ready futuristic control console for a hidden Red Room vehicle facility beneath Bermuda limestone, low black graphite command pedestal with restrained red and amber illuminated interface strips, premium advanced engineering, readable silhouette, isolated prop, no screen text or logos, optimized mobile open-world game asset"
          )

          for i in "${!names[@]}"; do
            name="${names[$i]}"
            echo "===== ESTIMATE ${name} ====="
            $M make "${prompts[$i]}" --dry-run --output-schema v1 --format json --no-update-check | tee ".meshy-late/estimates/${name}.json"
          done

          $M balance --output-schema v1 --format json --no-update-check | tee .meshy-late/balance-before.json

          python3 - <<'PY'
          import glob, json, sys
          total = 0
          print('\n=== LATE CAMPAIGN MESHY PREFLIGHT ===')
          for p in sorted(glob.glob('.meshy-late/estimates/*.json')):
              d = json.load(open(p, encoding='utf-8'))
              r = d.get('result') or d
              c = r.get('estimated_credits')
              print(f'{p}: {c}')
              if not isinstance(c, (int, float)):
                  print('Missing estimated_credits; refusing paid generation', file=sys.stderr)
                  sys.exit(2)
              total += c
          b = json.load(open('.meshy-late/balance-before.json', encoding='utf-8'))
          br = b.get('result') or b
          balance = br.get('balance')
          print(f'TOTAL_ESTIMATED_CREDITS={total}')
          print(f'AVAILABLE_BALANCE={balance}')
          if total > 90:
              print('Estimate exceeds the 90-credit late-campaign safety ceiling', file=sys.stderr)
              sys.exit(3)
          if not isinstance(balance, (int, float)) or balance < total:
              print('Insufficient Meshy balance for the three late-campaign assets', file=sys.stderr)
              sys.exit(9)
          PY

      - name: Generate late-campaign assets
        shell: bash
        run: |
          set -euo pipefail
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          mkdir -p .meshy-late/results .meshy-late/downloads public/models/bermuda/campaign/source

          names=(
            blue-hole-component
            limestone-door
            red-room-console
          )
          prompts=(
            "Game-ready mysterious artificial component recovered from a Bermuda blue hole, compact dark titanium alloy housing with an asymmetric readable silhouette, restrained amber luminous slit, mineral and salt-water wear, clearly manufactured but enigmatic, isolated prop with no ground plane, no text, optimized mobile open-world game asset"
            "Game-ready submerged secret limestone doorway for a Bermuda underwater cave, pale weathered natural limestone frame fused around a precise dark engineered portal and recessed sealed door, small amber locator lights, believable salt-water aging, front-facing readable doorway, isolated modular environment prop, no terrain or water plane, optimized mobile game asset"
            "Game-ready futuristic control console for a hidden Red Room vehicle facility beneath Bermuda limestone, low black graphite command pedestal with restrained red and amber illuminated interface strips, premium advanced engineering, readable silhouette, isolated prop, no screen text or logos, optimized mobile open-world game asset"
          )

          for i in "${!names[@]}"; do
            name="${names[$i]}"
            dl=".meshy-late/downloads/${name}"
            mkdir -p "$dl"
            echo "===== GENERATING ${name} ====="
            $M make "${prompts[$i]}" \
              --max-credits 30 \
              --timeout 900 \
              -o "$dl" \
              --output-schema v1 \
              --format json \
              --no-update-check | tee ".meshy-late/results/${name}.json"
            glb=$(find "$dl" -type f -name '*.glb' | head -n 1)
            test -n "$glb"
            cp "$glb" "public/models/bermuda/campaign/source/bermuda-${name}.glb"
            test -s "public/models/bermuda/campaign/source/bermuda-${name}.glb"
          done

      - name: Optimize for iPhone/WebGPU
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @gltf-transform/cli
          mkdir -p public/models/bermuda/campaign/mobile

          optimize_asset () {
            local name="$1"
            local ratio="$2"
            npx gltf-transform optimize \
              "public/models/bermuda/campaign/source/bermuda-${name}.glb" \
              "public/models/bermuda/campaign/mobile/bermuda-${name}.glb" \
              --simplify true --simplify-ratio "$ratio" --simplify-error 0.004 \
              --compress false --texture-compress webp --texture-size 1024
            test -s "public/models/bermuda/campaign/mobile/bermuda-${name}.glb"
          }

          optimize_asset blue-hole-component 0.24
          optimize_asset limestone-door 0.20
          optimize_asset red-room-console 0.22
          du -h public/models/bermuda/campaign/mobile/*.glb

      - name: Commit generated assets to this campaign branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/bermuda/campaign/source public/models/bermuda/campaign/mobile
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add Meshy late-campaign mission props'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Final Meshy balance
        if: always()
        shell: bash
        run: |
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          $M balance --output-schema v1 --format json --no-update-check || true

      - name: Preserve Meshy task records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-late-campaign-records-${{ github.run_id }}
          path: .meshy-late/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
