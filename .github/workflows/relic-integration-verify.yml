name: Verify RELIC integration
on:
  pull_request:
    paths:
      - 'src/world/Relic*.js'
      - 'src/world/BermudaIdentity.js'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/relic-integration-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers
      - run: npm test
      - run: npm run build
