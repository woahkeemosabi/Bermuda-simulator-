name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, 'bermuda-*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install official Bermuda loading artwork
        run: |
          if [ ! -s public/ui/bermuda-loading.jpg ]; then
            curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
              -o public/ui/bermuda-loading.jpg \
              'https://d2ol7oe51mr4n9.cloudfront.net/user_3A1q9BcQbl45SCnLUguSPsAMEGh/98b4aa4a-be69-4270-b49d-e08419050e26.jpg'
          fi
          test "$(wc -c < public/ui/bermuda-loading.jpg)" -gt 100000
      - name: Persist branded loading artwork in the repository
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch public/ui/bermuda-loading.jpg >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/ui/bermuda-loading.jpg
            git commit -m "Add Bermuda Simulator branded loading artwork"
            git push origin HEAD:main || echo "Artwork included in build; repository push unavailable"
          fi
      - name: Run CPU-safe game logic tests
        run: node test/game-logic.mjs && node test/bermuda-full-fidelity.mjs && node test/bermuda-loading-screen.mjs && node test/mobile-render-gate.mjs && node test/mobile-postfx.mjs && node test/mobile-gpu-audit.mjs && node test/mobile-cloud-isolation.mjs && node test/mobile-environment-isolation.mjs && node test/first-boat-mode.mjs && node test/mobile-recovery-profile.mjs
      - run: npm run build

      # Archive builds are independently compiled from the last iPhone-safe snapshots.
      # They are published under /archive/, never over the current site's root.
      - name: Checkout October 14 stable mobile version
        uses: actions/checkout@v4
        with:
          ref: d7f931404dc7b87c9d4fcacc2ed2aa12de213b43
          path: _recovery/oct14
          persist-credentials: false
      - name: Activate first-boat-only recovery and remove dockside residential mission props
        run: |
          cp src/game/FirstBoatMode.js _recovery/oct14/src/game/FirstBoatMode.js
          cp src/game/LifeProgression.js _recovery/oct14/src/game/LifeProgression.js
          cp src/game/BoatOwnership.js _recovery/oct14/src/game/BoatOwnership.js
          cp src/sky/Environment.js _recovery/oct14/src/sky/Environment.js
          cp src/materials/GroundBounce.js _recovery/oct14/src/materials/GroundBounce.js
          cp src/engine/Engine.js _recovery/oct14/src/engine/Engine.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('_recovery/oct14/src/world')
          p=root/'BermudaIdentity.js'
          s=p.read_text()
          def replace(old,new):
            global s
            assert s.count(old)==1, f'Expected one copy of {old[:60]!r}, got {s.count(old)}'
            s=s.replace(old,new)
          replace("import { LifeProgression } from '../game/LifeProgression.js';",
            "import { LifeProgression } from '../game/LifeProgression.js';\n"
            "import { BoatOwnership } from '../game/BoatOwnership.js';\n"
            "import { firstBoatModeEnabled } from '../game/FirstBoatMode.js';")
          replace("installRelic001( app );\n\tinstallRelicStory( app );",
            "if (!firstBoatModeEnabled()) { installRelic001( app ); installRelicStory( app ); }")
          replace("installRelicMobileModes( app );",
            "if (!firstBoatModeEnabled()) installRelicMobileModes( app );")
          replace("if ( ! app.progression ) new LifeProgression( app );",
            "if ( ! app.progression ) new LifeProgression( app );\n"
            "\tif (firstBoatModeEnabled() && !app.boatOwnership) new BoatOwnership( app );")
          replace("const waterfrontReady = installBermudaModels( app );",
            "const waterfrontReady = phone ? Promise.resolve(null) : installBermudaModels( app );")
          p.write_text(s)
          # Keep the dock, road and walkable ramps; omit the concentrated
          # cottages and their extra collision boxes from the loading scene.
          p=root/'BermudaBlockout.js'
          s=p.read_text()
          a=s.index(' const steppedRoof=')
          b=s.index(' const moorings=',a)
          s=s[:a]+' // Houses are not in the first-boat loading district.\n'+s[b:]
          assert 'house({x:' not in s
          p.write_text(s)
          p=root/'ReferenceWorldUpgrade.js'
          s=p.read_text()
          a=s.index('\tconst addRoof =')
          b=s.index('\tapp.scene.add( group );',a)
          s=s[:a]+'\t// Residential set dressing reserved for a later island sector.\n'+s[b:]
          assert 'const addHouse' not in s
          p.write_text(s)
          PY
          # Historical Oct14 engine, but with tightly controlled WebGPU recovery startup.
          python3 - <<'PY'
          from pathlib import Path
          folder=Path('_recovery/oct14/src')
          def patch(path,old,new):
            p=folder/path
            src=p.read_text()
            count=src.count(old)
            assert count==1, f'{p}: expected one anchor, got {count}: {old[:80]!r}'
            p.write_text(src.replace(old,new,1))
          # Cut three shadow cascades from 2048^2 to 512^2 before any WebGPU
          # allocation; never let the legacy post-init memory profile enlarge them.
          for old,new in [
            ("app.shadows.size = 1024;","app.shadows.size = 512;"),
            ("app.shadows.texture.width = 1024;","app.shadows.texture.width = 512;"),
            ("app.shadows.texture.height = 1024;","app.shadows.texture.height = 512;"),
            ("ShadowUniforms.fields.mapSize.value = 1024;","ShadowUniforms.fields.mapSize.value = 512;"),
          ]:
            patch('main.js',old,new)
          # Remove the fabricated circular highland mound from the archived island.
          identity=folder/'world/BermudaIdentity.js'
          terrain=identity.read_text()
          start=terrain.index("\t\tconst smooth = t => t*t*(3-2*t);")
          end=terrain.index("\t\treturn result;",start)
          terrain=terrain[:start]+"\t\t// Original island profile: no synthetic inland mound.\\n".replace('\\n','\n')+terrain[end:]
          identity.write_text(terrain)
          # Original archived main is compatible with its own dependency graph. Do not
          # copy the modern main: the Oct14 snapshot predates WebGPU readback modules.
          patch('main.js',
            "url.searchParams.set( 'scale', '0.82' );",
            "url.searchParams.set( 'scale', '0.70' );\n"
            "\turl.searchParams.set( 'noAudio', '1' );")
          patch('main.js',
            "if ( app.audio ) app.audio.resume();\n\t\t\tapp.start();",
            "app.start(); // no AudioContext constructed in this recovery")
          patch('main.js',
            "applyBermudaRuntimeLook( app );",
            "applyBermudaRuntimeLook( app );\n"
            "\tif (mobileFastStart && app.engine) app.engine.mobileGpuFramePacing = true;")
          # The October 14 App predates the mobileLite variable present in the
          # current App. Define it inside init BEFORE the first shader/GPU resource.
          patch('App.js',
            "const qs = this.qs;",
            "const qs = this.qs;\n"
            "\t\tconst mobileLite = !qs.has('desktop') && (qs.get('quality') === 'mobile-safe' || "
            "/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || "
            "(navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 1024));")
          patch('App.js',
            "size: 2048, splits:",
            "size: mobileLite ? 512 : 2048, splits:")
          patch('App.js',
            "this.environment = new Environment( renderer, scene, this.sky );",
            "this.environment = new Environment( renderer, scene, this.sky, mobileLite ? 32 : 128 );\n"
            "\t\tif (mobileLite) { this.environment.progressivePrime = true; this.environment.freezeAfterPrime = true; }")
          patch('App.js',
            "this.fft = new OceanFFT( renderer );",
            "this.fft = new OceanFFT( renderer, mobileLite ? {cascades:2} : {} );")
          patch('App.js',
            "this.whale = new Whale( { scene, terrain: this.terrainData, query: this.query, spray: this.spray } );",
            "this.whale = mobileLite ? null : new Whale( { scene, terrain: this.terrainData, query: this.query, spray: this.spray } );")
          patch('App.js',
            "await this.whale.load();",
            "if (this.whale) await this.whale.load();")
          patch('App.js',
            "if ( this.reef && this.reef.setWhale ) this.reef.setWhale( this.whale );",
            "if ( this.whale && this.reef && this.reef.setWhale ) this.reef.setWhale( this.whale );")
          patch('App.js',
            "this.surface.wake = this.wake;",
            "this.surface.wake = mobileLite ? null : this.wake;")
          patch('App.js',
            "this.freeCam = qs.has( 'fly' );",
            "this.freeCam = qs.has( 'fly' );\n"
            "\t\tif (mobileLite && qs.get('recovery') === '1') {\n"
            "\t\t\tfor (const fx of [this.spray,this.breakers,this.marineSnow,this.airMotes]) {\n"
            "\t\t\t\tif(fx?.mesh) fx.mesh.visible=false;\n"
            "\t\t\t\tif(fx) fx.update=()=>{};\n"
            "\t\t\t}\n"
            "\t\t\tthis.boatSpray.update=()=>{}; this.wake.update=()=>{};\n"
            "\t\t}")
          print('Oct14 recovery engine: no audio, progressive HDR, two FFT cascades, no GPU particles, 25fps pacing')
          PY
          # Ensure archive-only variables referenced by our patches exist in their
          # historical scope; Vite syntax bundling cannot detect unbound variables.
          python3 - <<'PY'
          from pathlib import Path
          app=Path('_recovery/oct14/src/App.js').read_text()
          main=Path('_recovery/oct14/src/main.js').read_text()
          assert app.count("const mobileLite = !qs.has('desktop')") == 1, 'October 14 mobileLite not declared'
          assert app.index("const mobileLite = !qs.has('desktop')") < app.index("new SunShadows(")
          assert app.index("const mobileLite = !qs.has('desktop')") < app.index("new Environment(")
          assert "new OceanFFT( renderer, mobileLite ? {cascades:2}" in app
          assert "url.searchParams.set( 'noAudio', '1' );" in main
          assert "app.start(); // no AudioContext constructed" in main
          print('October 14 runtime-scope regression checks passed')
          PY
          node --input-type=module -e "import {firstBoatModeEnabled} from './_recovery/oct14/src/game/FirstBoatMode.js'; if(!firstBoatModeEnabled(new URLSearchParams('missions=boat')))throw Error('Boat mode missing'); console.log('Boat-only recovery source prepared')"
      - name: Build October 14 mobile recovery with $2454 and independent save
        working-directory: _recovery/oct14
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/GameState.js')
          s=p.read_text()
          assert s.count("const SAVE_KEY = 'tidewater.save.v1';")==1
          assert s.count('this.money = 75;')==2
          s=s.replace("const SAVE_KEY = 'tidewater.save.v1';","const SAVE_KEY = 'bermuda.recovery.wallet2454.v2.save.v1';")
          s=s.replace('this.money = 75;','this.money = 2454;')
          s=s.replace("( d.v === 1 ? 0 : 75 )","( d.v === 1 ? 0 : 2454 )")
          p.write_text(s)
          assert "this.money = 2454;" in p.read_text()
          PY
          npm ci
          node --input-type=module -e "import {GameState} from './src/game/GameState.js'; const s=new GameState({getItem:()=>null,setItem:()=>{}}); if(s.money!==2454||s.boats.owned.length!==0||s.boats.activeBoat!==null)throw Error('Recovery economy mismatch'); console.log('Verified: $2454, no owned boat, isolated save');"
          npm run build
      - name: Checkout September 30 core-mobile version
        uses: actions/checkout@v4
        with:
          ref: 7e2394a4cf43372e3b3f4373709bbbb710ad4b90
          path: _recovery/sep30
          persist-credentials: false
      - name: Build exact September 30 wallet-era snapshot with isolated save
        working-directory: _recovery/sep30
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/GameState.js')
          s=p.read_text()
          assert s.count("const SAVE_KEY = 'tidewater.save.v1';")==1
          assert s.count('this.money = 75;')==2
          s=s.replace("const SAVE_KEY = 'tidewater.save.v1';","const SAVE_KEY = 'bermuda.recovery.original2454.save.v1';")
          s=s.replace('this.money = 75;','this.money = 2454;')
          s=s.replace("( d.v === 1 ? 0 : 75 )","( d.v === 1 ? 0 : 2454 )")
          p.write_text(s)
          PY
          npm ci
          node --input-type=module -e "import {GameState} from './src/game/GameState.js'; const s=new GameState({getItem:()=>null,setItem:()=>{}}); if(s.money!==2454||s.boats.owned.length!==0||s.boats.activeBoat!==null)throw Error('Recovery economy mismatch'); console.log('Verified: $2454, no owned boat, isolated save');"
          npm run build
      - name: Publish playable recovery versions without replacing current game
        run: |
          mkdir -p dist/archive/oct14 dist/archive/sep30
          cp -a _recovery/oct14/dist/. dist/archive/oct14/
          cp -a _recovery/sep30/dist/. dist/archive/sep30/
          # Preserve the existing player state before a historical build can autosave
          # under the same tidewater.save.v1 key. The backup is distinct, and created
          # at most once, without changing current game data.
          python3 - <<'PY'
          from pathlib import Path
          def guard(name):
            return """
          <script>
          // Archive uses its own storage slot: NEVER overwrite the original save.
          try {
            const originalKey='tidewater.save.v1';
            const originalBackup='bermuda.recovery.original-save.v1';
            const slot='bermuda.recovery.ARCHIVE.save.v1';
            const original=localStorage.getItem(originalKey);
            if(original && !localStorage.getItem(originalBackup)) localStorage.setItem(originalBackup,original);
            if(!localStorage.getItem(slot)) {
              const candidates=[localStorage.getItem(originalBackup),original];
              for(const item of candidates) {
                if(!item) continue;
                try {
                  const save=JSON.parse(item);
                  const owned=save?.boats?.owned||[];
                  if(save && save.money>=2000 && Array.isArray(owned) && owned.length===0 &&
                     (save.v===1||save.v===2)) {
                    localStorage.setItem(slot,item); // restore a matching real saved game
                    break;
                  }
                } catch (_) {}
              }
            }
          } catch (_) {}
          </script>
          """.replace('ARCHIVE',name)
          
          for name in ('oct14', 'sep30'):
            file = Path('dist/archive') / name / 'index.html'
            txt = file.read_text()
            assert '<head>' in txt
            file.write_text(txt.replace('<head>', '<head>\n'+guard('wallet2454.v2' if name=='oct14' else 'original2454'), 1))
          PY
          test -s dist/archive/oct14/index.html
          test -s dist/archive/sep30/index.html
          find dist/archive -name index.html -maxdepth 3 -print
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

