name: Bermuda Simulator — single production Pages release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main game
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify approved Bermuda loading screen and gameplay
        run: |
          test -s public/ui/bermuda-loading.jpg
          test "$(wc -c < public/ui/bermuda-loading.jpg)" -gt 100000
          node test/game-logic.mjs
          node test/bermuda-full-fidelity.mjs
          node test/bermuda-loading-screen.mjs
          node test/mobile-render-gate.mjs
          node test/mobile-postfx.mjs
          node test/mobile-gpu-audit.mjs
          node test/mobile-cloud-isolation.mjs
          node test/mobile-environment-isolation.mjs
          node test/first-boat-mode.mjs
          node test/mobile-recovery-profile.mjs
      - name: Build canonical game
        run: |
          rm -rf dist
          npm run build
      - name: Remove legacy alternate game pages from published output
        run: |
          rm -rf dist/archive dist/qa dist/recovery dist/coastal dist/previews dist/test-builds
          find dist -type f -name 'index.html' ! -path 'dist/index.html' -print -delete
          test "$(find dist -type f -name 'index.html' | wc -l)" -eq 1
      - name: Confirm release files
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/ui/bermuda-loading.jpg
          printf '{"channel":"main","version":"canonical","source":"main"}\n' > dist/coastal-release.json
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
