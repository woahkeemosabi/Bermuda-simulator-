name: Apply Bermuda Reference Corrections

on:
  push:
    paths:
      - '.github/workflows/apply-reference-corrections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply correction pass
        shell: bash
        run: python -c "import base64;exec(base64.b64decode(''))"

      - name: Commit correction pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/BermudaBlockout.js src/world/bermuda/AssetLayout.js src/world/ReferenceWorldUpgrade.js src/world/ReferenceDetailUpgrade.js src/game/DockShopFixtures.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: open dock route and improve Bermuda reference details'
          git pull --rebase origin main
          git push origin HEAD:main
