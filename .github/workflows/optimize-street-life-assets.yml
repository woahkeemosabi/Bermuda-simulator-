name: Optimize Bermuda Street Life Assets

on:
  push:
    paths:
      - 'public/models/bermuda/street-life/*.glb'
      - '.github/workflows/optimize-street-life-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-bermuda-street-life
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install glTF optimizer
        run: npm install --no-save @gltf-transform/cli

      - name: Build street-life mobile and desktop tiers
        shell: bash
        run: |
          set -euo pipefail
          srcdir='public/models/bermuda/street-life'
          mkdir -p "$srcdir/mobile" "$srcdir/desktop"
          shopt -s nullglob
          files=("$srcdir"/*.glb)

          if [ ${#files[@]} -gt 0 ]; then
            for src in "${files[@]}"; do
              base=$(basename "$src")
              echo "===== OPTIMIZING $base ====="

              # Desktop retains a strong silhouette and 2K texture detail while stripping Meshy's
              # huge source texture payload. Keep core GLB geometry; the simulator does not use
              # Draco or meshopt runtime decoding.
              npx gltf-transform optimize "$src" "$srcdir/desktop/$base" \
                --simplify true --simplify-ratio 0.52 --simplify-error 0.0015 \
                --compress false --texture-compress webp --texture-size 2048

              # Mobile aggressively reduces hidden/micro geometry while preserving character and
              # scooter silhouettes. Textures are capped at 1K for the iPhone WebGPU profile.
              case "$base" in
                bermuda-scooter.glb) ratio=0.24 ;;
                bermuda-npc-male.glb|bermuda-npc-female.glb) ratio=0.20 ;;
                *) ratio=0.20 ;;
              esac
              npx gltf-transform optimize "$src" "$srcdir/mobile/$base" \
                --simplify true --simplify-ratio "$ratio" --simplify-error 0.003 \
                --compress false --texture-compress webp --texture-size 1024
            done

            # Raw Meshy exports are 35–92 MB apiece and must not ship in the public build.
            rm -f "$srcdir"/*.glb
          else
            echo 'Raw exports already removed; applying final scooter-specific LOD pass.'
            test -s "$srcdir/mobile/bermuda-scooter.glb"
            test -s "$srcdir/desktop/bermuda-scooter.glb"

            # Scooter geometry was much denser than the people. A second targeted simplification
            # keeps the visible silhouette, wheels, mirrors and bodywork while making initial
            # iPhone streaming practical. NPC tiers are already in the desired size range.
            npx gltf-transform optimize "$srcdir/mobile/bermuda-scooter.glb" /tmp/scooter-mobile.glb \
              --simplify true --simplify-ratio 0.36 --simplify-error 0.0045 \
              --compress false --texture-compress webp --texture-size 1024
            mv /tmp/scooter-mobile.glb "$srcdir/mobile/bermuda-scooter.glb"

            npx gltf-transform optimize "$srcdir/desktop/bermuda-scooter.glb" /tmp/scooter-desktop.glb \
              --simplify true --simplify-ratio 0.55 --simplify-error 0.0025 \
              --compress false --texture-compress webp --texture-size 2048
            mv /tmp/scooter-desktop.glb "$srcdir/desktop/bermuda-scooter.glb"
          fi

          echo '===== FINAL STREET-LIFE SIZES ====='
          du -h "$srcdir"/mobile/*.glb "$srcdir"/desktop/*.glb

      - name: Commit optimized tiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/models/bermuda/street-life
          git diff --cached --quiet && exit 0
          git commit -m 'assets: tighten Meshy street-life LODs'
          git pull --rebase origin main
          git push origin HEAD:main
