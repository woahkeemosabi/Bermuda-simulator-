name: Optimize Bermuda Street Life Assets

on:
  push:
    paths:
      - 'public/models/bermuda/street-life/*.glb'
      - '.github/workflows/optimize-street-life-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-bermuda-street-life
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install glTF optimizer
        run: npm install --no-save @gltf-transform/cli

      - name: Build street-life mobile and desktop tiers
        shell: bash
        run: |
          set -euo pipefail
          srcdir='public/models/bermuda/street-life'
          mkdir -p "$srcdir/mobile" "$srcdir/desktop"
          shopt -s nullglob
          files=("$srcdir"/*.glb)

          if [ ${#files[@]} -gt 0 ]; then
            for src in "${files[@]}"; do
              base=$(basename "$src")
              echo "===== OPTIMIZING $base ====="
              npx gltf-transform optimize "$src" "$srcdir/desktop/$base" \
                --simplify true --simplify-ratio 0.52 --simplify-error 0.0015 \
                --compress false --texture-compress webp --texture-size 2048
              case "$base" in
                bermuda-scooter.glb) ratio=0.24 ;;
                bermuda-npc-male.glb|bermuda-npc-female.glb) ratio=0.20 ;;
                *) ratio=0.20 ;;
              esac
              npx gltf-transform optimize "$src" "$srcdir/mobile/$base" \
                --simplify true --simplify-ratio "$ratio" --simplify-error 0.003 \
                --compress false --texture-compress webp --texture-size 1024
            done
            rm -f "$srcdir"/*.glb
          else
            echo 'Raw exports already removed; applying gameplay LOD targets.'
            for tier in mobile desktop; do
              for base in bermuda-scooter bermuda-npc-male bermuda-npc-female; do
                test -s "$srcdir/$tier/$base.glb"
                src="$srcdir/$tier/$base.glb"
                out="/tmp/${tier}-${base}.glb"
                if [ "$tier" = mobile ]; then
                  tex=1024; err=0.006
                  case "$base" in
                    bermuda-scooter) ratio=0.13 ;;
                    bermuda-npc-male) ratio=0.20 ;;
                    bermuda-npc-female) ratio=0.15 ;;
                  esac
                else
                  tex=2048; err=0.003
                  case "$base" in
                    bermuda-scooter) ratio=0.13 ;;
                    bermuda-npc-male) ratio=0.20 ;;
                    bermuda-npc-female) ratio=0.17 ;;
                  esac
                fi
                echo "===== FINAL LOD $tier/$base ratio=$ratio ====="
                npx gltf-transform optimize "$src" "$out" \
                  --simplify true --simplify-ratio "$ratio" --simplify-error "$err" \
                  --compress false --texture-compress webp --texture-size "$tex"
                mv "$out" "$src"
              done
            done
          fi

          echo '===== FINAL STREET-LIFE SIZES ====='
          du -h "$srcdir"/mobile/*.glb "$srcdir"/desktop/*.glb

      - name: Commit optimized tiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/models/bermuda/street-life
          git diff --cached --quiet && exit 0
          git commit -m 'assets: finalize Meshy street-life gameplay LODs'
          git pull --rebase origin main
          git push origin HEAD:main
