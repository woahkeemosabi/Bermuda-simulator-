name: Step 3 Mobile Warm-up

on:
  push:
    branches:
      - bermuda-step3-mobile-warmup

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bermuda-step3-mobile-warmup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore bounded full mobile precompile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.js')
          app = app_path.read_text()
          pattern = re.compile(r"\tasync precompile\(\) \{.*?\n\t\}\n\n\t// ---------------------------------------------------------------- sun / sky", re.S)
          replacement = r'''\tasync precompile( maxWaitMs = Infinity ) {

\t\tconst mr = this.engine.meshRenderer;
\t\tconst bounded = Number.isFinite( maxWaitMs );
\t\tconst deadline = bounded ? performance.now() + Math.max( 0, maxWaitMs ) : Infinity;
\t\tconst wait = async ( promise ) => {

\t\t\tif ( ! bounded ) {

\t\t\t\tawait promise;
\t\t\t\treturn true;

\t\t\t}
\t\t\tconst remaining = deadline - performance.now();
\t\t\tif ( remaining <= 0 ) return false;
\t\t\tlet timer = null;
\t\t\ttry {

\t\t\t\treturn await Promise.race( [
\t\t\t\t\tpromise.then( () => true ),
\t\t\t\t\tnew Promise( ( resolve ) => { timer = setTimeout( () => resolve( false ), remaining ); } ),
\t\t\t\t] );

\t\t\t} finally {

\t\t\t\tif ( timer !== null ) clearTimeout( timer );

\t\t\t}

\t\t};
\t\tconst refr = this.refraction.enabled;
\t\t// Compute / post pipelines were requested while the systems were built. Desktop keeps the
\t\t// original full wait before the traversal; mobile skips that first wait so the complete scene
\t\t// pipeline set is requested immediately and then uses the remaining bounded warm-up window.
\t\tif ( ! this.post._built ) {

\t\t\tthis.post._build();
\t\t\tthis.post._outW = 0;

\t\t}
\t\tif ( ! bounded ) await GPU.pipelinesReady();
\t\tmr.precompiling = true;
\t\tthis.refraction.enabled = true;
\t\tconst sr = this.sceneRenderer, hm = sr.hullMaskRT;
\t\tif ( sr.hullMasks.length ) mr.render( sr.hullMaskScene, {
\t\t\tlabel: 'hull mask', kind: 'color', camera: this.camera, colorViews: [ hm.texture.view() ], colorFormats: hm.formats,
\t\t\tclearColors: [ [ 0, 0, 0, 0 ] ], depthView: hm.depthTexture.view(), depthFormat: DEPTH_FORMAT, clearDepth: 0, cull: false,
\t\t} );
\t\ttry {

\t\t\t// Call the real frame implementation directly. main.js gates App.frame() on mobile until
\t\t\t// Explore, and calling the gated wrapper here used to turn the warm-up into a no-op.
\t\t\tfor ( const hull of [ 0, 1 ] ) {

\t\t\t\tthis.waterMaterial.hullOverride = hull;
\t\t\t\tthis._frame( 1 / 60 );

\t\t\t}

\t\t} catch ( e ) {

\t\t\tconsole.warn( 'precompile failed', e );

\t\t} finally {

\t\t\tthis.waterMaterial.hullOverride = null;
\t\t\tmr.precompiling = false;
\t\t\tthis.refraction.enabled = refr;

\t\t}
\t\tif ( bounded && performance.now() >= deadline ) return;
\t\tawait wait( GPU.pipelinesReady() );
\t\tif ( ! bounded || performance.now() < deadline ) await wait( GPU.queue.onSubmittedWorkDone() );

\t}

\t// ---------------------------------------------------------------- sun / sky'''
          app2, n = pattern.subn(replacement, app, count=1)
          if n != 1:
              raise SystemExit(f'App.js precompile replacement count={n}')
          app_path.write_text(app2)

          main_path = Path('src/main.js')
          main = main_path.read_text()
          old = '''\t// Keep all scene pipelines asynchronous on mobile. MeshRenderer explicitly supports this mode:
\t// a draw whose pipeline is still compiling is skipped for that frame instead of forcing a
\t// synchronous WebGPU compile.
\tApp.prototype.precompile = async function() {

\t\tawait Promise.race( [
\t\t\tGPU.pipelinesReady(),
\t\t\tnew Promise( ( resolve ) => setTimeout( resolve, 25000 ) ),
\t\t] );
\t\tif ( this.engine && this.engine.meshRenderer ) this.engine.meshRenderer.syncPipelines = false;

\t};'''
          new = '''\t// Keep scene pipelines asynchronous on mobile, but still run App's complete hidden-scene
\t// precompile pass. The previous mobile override only waited for pipelines that already existed,
\t// so meshes first seen after Explore could compile during a camera turn. Cap the full warm-up at
\t// the same 25 seconds used by the previous path.
\tconst fullPrecompile = App.prototype.precompile;
\tApp.prototype.precompile = async function() {

\t\tawait fullPrecompile.call( this, 25000 );
\t\tif ( this.engine && this.engine.meshRenderer ) this.engine.meshRenderer.syncPipelines = false;

\t};'''
          if old not in main:
              raise SystemExit('main.js mobile precompile block not found')
          main_path.write_text(main.replace(old, new, 1))
          PY

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit Step 3 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/step3-mobile-warmup.yml
          git add src/App.js src/main.js
          git commit -m "Warm mobile pipelines before gameplay"
          git push origin HEAD:bermuda-step3-mobile-warmup
