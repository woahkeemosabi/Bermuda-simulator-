name: WebGPU recovery validation
on:
  pull_request:
    branches: [main]
  push:
    branches: ['fix/webgpu-recovery-*']
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/webgpu-recovery.mjs
      - run: node test/game-logic.mjs
      - run: node test/mobile-render-gate.mjs && node test/mobile-recovery-profile.mjs
      - run: node test/bermuda-full-fidelity.mjs && node test/bermuda-loading-screen.mjs
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
