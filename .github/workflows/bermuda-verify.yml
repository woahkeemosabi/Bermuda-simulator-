name: Verify waterfront rendering
on:
  push:
    branches: [bermuda-waterfront-verified-v2, bermuda-waterfront-expansion-recovery, bermuda-world-polish-v1]
    paths: ['src/**', 'test/**', '.github/workflows/bermuda-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm install --no-save pngjs
      - run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers
      - run: node test/bermuda-assets.mjs && node test/bermuda-layout.mjs && node test/game-logic.mjs && node test/life-player.mjs && node test/life-player.mjs --bermuda && node test/world-polish.mjs && npm run build
      - run: node test/bermuda-render.mjs
        env:
          XDG_RUNTIME_DIR: /tmp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterfront-native-render
          path: verification/
