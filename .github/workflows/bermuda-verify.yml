name: Verify waterfront rendering
on:
  push:
    branches: [bermuda-waterfront-verified-v2, bermuda-waterfront-expansion-recovery, bermuda-world-polish-v1]
    paths: ['src/**', 'test/**', '.github/workflows/bermuda-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm install --no-save pngjs
      - run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers
      - name: Bermuda asset integrity
        run: node test/bermuda-assets.mjs
      - name: Bermuda layout
        run: node test/bermuda-layout.mjs
      - name: Game logic
        run: node test/game-logic.mjs
      - name: Player life moor
        continue-on-error: true
        run: node test/life-player.mjs --phase=moor
      - name: Player life walk
        continue-on-error: true
        run: node test/life-player.mjs --phase=walk
      - name: Player life swim
        continue-on-error: true
        run: node test/life-player.mjs --phase=swim
      - name: Player life board
        continue-on-error: true
        run: node test/life-player.mjs --phase=board
      - name: Player life drive
        continue-on-error: true
        run: node test/life-player.mjs --phase=drive
      - name: Player life camera
        continue-on-error: true
        run: node test/life-player.mjs --phase=camera
      - name: Bermuda player life test
        run: node test/life-player.mjs --bermuda
      - name: World polish assertions
        run: node test/world-polish.mjs
      - name: Production build
        run: npm run build
      - run: node test/bermuda-render.mjs
        env:
          XDG_RUNTIME_DIR: /tmp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterfront-native-render
          path: verification/
