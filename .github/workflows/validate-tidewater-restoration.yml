name: Tidewater restoration validation
on:
  push:
    branches: [restore/tidewater-renderer-baseline-20261028]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node test/game-logic.mjs
      - run: node test/bermuda-layout.mjs
      - run: npm run build
