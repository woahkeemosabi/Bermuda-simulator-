name: Alpha stability verify

on:
  push:
    branches: [alpha-stability-pass]
    paths:
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/alpha-stability-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install software WebGPU driver
        run: sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: npm ci
      - name: Game tests
        id: tests
        continue-on-error: true
        run: npm test
        env:
          XDG_RUNTIME_DIR: /tmp
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      - name: Production build and offline bundle
        run: npm run build
      - name: Preserve test failure
        if: steps.tests.outcome != 'success'
        run: |
          echo "Game tests failed before/alongside this stability pass; build result above is still authoritative for syntax/bundling."
          exit 1
