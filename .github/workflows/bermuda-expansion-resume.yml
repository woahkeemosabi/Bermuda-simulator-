name: Resume and optimize Bermuda expansion
on:
  push:
    branches: [bermuda-waterfront-expansion-recovery]
    paths: ['.github/workflows/bermuda-expansion-resume.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bermuda-expansion-resume
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bermuda-waterfront-expansion-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install Pillow
      - run: |
          node --version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/bermuda/expand_recover.py
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-recovery-records
          path: |
            ${{ runner.temp }}/bermuda-expansion-resume/projects/
            tools/bermuda/expansion-lineage.json
            public/models/bermuda/mobile-v3/previews/
          include-hidden-files: true
          retention-days: 30
