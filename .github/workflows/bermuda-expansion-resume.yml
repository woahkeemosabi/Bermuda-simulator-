name: Resume and optimize Bermuda expansion
on:
  push:
    branches: [bermuda-waterfront-expansion-recovery]
    paths: ['.github/workflows/bermuda-expansion-resume.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bermuda-expansion-resume
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bermuda-waterfront-expansion-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install Pillow
      - name: Resume preserved Meshy tasks and build mobile assets
        run: |
          node --version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Meshy CLI confines downloads to --workspace. Keep the temporary project
          # directory and repository outputs beneath the same authorised repo root.
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/bermuda/expand_recover.py')
          s = p.read_text()
          s = s.replace("WORK=pathlib.Path(os.environ['RUNNER_TEMP'])/'bermuda-expansion-resume'; WORK.mkdir(exist_ok=True)", "WORK=ROOT/'.meshy-expansion-resume'; WORK.mkdir(exist_ok=True)")
          s = s.replace("FLAGS=['--output-schema','v1','--format','json','--no-update-check','--workspace',str(WORK)]", "FLAGS=['--output-schema','v1','--format','json','--no-update-check','--workspace',str(ROOT)]")
          p.write_text(s)
          PY
          python tools/bermuda/expand_recover.py
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-recovery-records
          path: |
            .meshy-expansion-resume/projects/
            tools/bermuda/expansion-lineage.json
            public/models/bermuda/mobile-v3/previews/
          include-hidden-files: true
          retention-days: 30
