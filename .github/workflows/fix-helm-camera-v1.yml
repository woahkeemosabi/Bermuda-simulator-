name: Fix helm camera toggle

on:
  push:
    branches: [bermuda-world-polish-v1]
    paths:
      - '.github/workflows/fix-helm-camera-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bermuda-world-polish-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Correct boat camera toggle
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/player/Player.js')
          s = p.read_text()
          old = "if ( inp.hit( 'KeyV' ) ) this.camMode = this.camMode === 'first' ? 'first' : 'third';"
          new = "if ( inp.hit( 'KeyV' ) ) this.camMode = this.camMode === 'first' ? 'third' : 'first';"
          if old not in s:
              raise SystemExit('helm camera toggle anchor missing')
          p.write_text(s.replace(old, new, 1))
      - name: Verify drive phase
        run: node test/life-player.mjs --bermuda --phase=drive
      - name: Verify complete Bermuda player life
        run: node test/life-player.mjs --bermuda
      - name: Commit fix
        run: |
          git config user.name "bermuda-simulator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/player/Player.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix boat helm camera toggle"
          git push origin HEAD:bermuda-world-polish-v1
