name: Meshy Production Asset Pass

on:
  push:
    paths:
      - '.github/workflows/meshy-production-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshy-production-assets
  cancel-in-progress: false

jobs:
  production-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GLB optimizer
        run: npm install --no-save @gltf-transform/cli

      - name: Preflight Meshy balance and generation estimates
        shell: bash
        run: |
          set -euo pipefail
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          mkdir -p .meshy-production/estimates .meshy-production/results

          relic_prompt="RELIC 001 futuristic black hypercar for a high-end open-world game, very low and wide road stance, sharp faceted stealth body panels, cab-forward glass canopy, muscular rear haunches, functional wheel arches, four visible performance wheels, aggressive aerodynamic diffuser, crisp white blade LED headlights and DRLs, distinctive red geometric rear light blades with a small central hexagonal red light, black graphite PBR body with subtle carbon-fiber and satin-metal details, believable production-car proportions, full exterior vehicle only, isolated, no driver, no ground, no text, no logos, no police markings, no sci-fi tank proportions"
          lobster_prompt="Bermuda spiny lobster Panulirus argus game asset, anatomically believable Caribbean spiny lobster with long paired antennae, segmented armored tail, walking legs, mottled rust brown tan and cream shell pattern, realistic proportions and shell surface, slightly raised natural crawling pose, high quality PBR game model, isolated animal, no ground, no water, no plate, no cooked food"

          $M make "$relic_prompt" --dry-run --output-schema v1 --format json --no-update-check | tee .meshy-production/estimates/relic.json
          $M make "$lobster_prompt" --dry-run --output-schema v1 --format json --no-update-check | tee .meshy-production/estimates/lobster.json
          $M balance --output-schema v1 --format json --no-update-check | tee .meshy-production/results/balance-before.json

          python3 - <<'PY'
          import json
          total = 0
          for path in ('.meshy-production/estimates/relic.json', '.meshy-production/estimates/lobster.json'):
              d = json.load(open(path, encoding='utf-8'))
              r = d.get('result') or d
              c = r.get('estimated_credits')
              print(path, 'estimated_credits=', c)
              if not isinstance(c, (int, float)):
                  raise SystemExit('Missing Meshy credit estimate; refusing paid generation')
              total += c
          d = json.load(open('.meshy-production/results/balance-before.json', encoding='utf-8'))
          r = d.get('result') or d
          balance = r.get('balance')
          print('TOTAL_ESTIMATED_GENERATION_CREDITS=', total)
          print('AVAILABLE_BALANCE=', balance)
          if not isinstance(balance, (int, float)) or balance < total:
              raise SystemExit('Insufficient Meshy balance for generation pass')
          if total > 80:
              raise SystemExit('Generation estimate exceeds 80-credit safety ceiling')
          PY

      - name: Generate RELIC 001 and Bermuda spiny lobster
        shell: bash
        run: |
          set -euo pipefail
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          mkdir -p public/models/bermuda/hero/desktop public/models/bermuda/hero/mobile \
                   .meshy-production/downloads .meshy-production/previews .meshy-production/results

          names=(relic-001 bermuda-spiny-lobster)
          prompts=(
            "RELIC 001 futuristic black hypercar for a high-end open-world game, very low and wide road stance, sharp faceted stealth body panels, cab-forward glass canopy, muscular rear haunches, functional wheel arches, four visible performance wheels, aggressive aerodynamic diffuser, crisp white blade LED headlights and DRLs, distinctive red geometric rear light blades with a small central hexagonal red light, black graphite PBR body with subtle carbon-fiber and satin-metal details, believable production-car proportions, full exterior vehicle only, isolated, no driver, no ground, no text, no logos, no police markings, no sci-fi tank proportions"
            "Bermuda spiny lobster Panulirus argus game asset, anatomically believable Caribbean spiny lobster with long paired antennae, segmented armored tail, walking legs, mottled rust brown tan and cream shell pattern, realistic proportions and shell surface, slightly raised natural crawling pose, high quality PBR game model, isolated animal, no ground, no water, no plate, no cooked food"
          )

          for i in "${!names[@]}"; do
            name="${names[$i]}"
            prompt="${prompts[$i]}"
            dl=".meshy-production/downloads/${name}"
            mkdir -p "$dl"
            echo "===== GENERATING ${name} ====="
            $M make "$prompt" \
              --max-credits 30 \
              --timeout 1200 \
              -o "$dl" \
              --output-schema v1 \
              --format json \
              --no-update-check | tee ".meshy-production/results/${name}.json"

            src=$(find "$dl" -type f -name '*.glb' | head -n 1)
            test -n "$src"
            cp "$src" ".meshy-production/${name}-source.glb"
            p=$(find "$dl" -type f \( -name 'preview.png' -o -name '*thumbnail*.png' -o -name '*.png' \) | head -n 1 || true)
            if [ -n "$p" ]; then cp "$p" ".meshy-production/previews/${name}.png"; fi

            if [ "$name" = "relic-001" ]; then
              mobile_ratio=0.55
            else
              mobile_ratio=0.45
            fi

            npx gltf-transform optimize ".meshy-production/${name}-source.glb" \
              "public/models/bermuda/hero/desktop/${name}.glb" \
              --compress false --texture-compress webp --texture-size 2048
            npx gltf-transform optimize ".meshy-production/${name}-source.glb" \
              "public/models/bermuda/hero/mobile/${name}.glb" \
              --simplify true --simplify-ratio "$mobile_ratio" --simplify-error 0.002 \
              --compress false --texture-compress webp --texture-size 1024
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/bermuda/hero
          git commit -m "asset: add Meshy RELIC and Bermuda lobster production models"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validate character sources before rigging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          paths = [
              'public/models/bermuda/street-life/desktop/bermuda-npc-male.glb',
              'public/models/bermuda/street-life/desktop/bermuda-npc-female.glb',
          ]
          for path in paths:
              data = open(path,'rb').read()
              if data[:4] != b'glTF': raise SystemExit(f'{path}: invalid GLB')
              total = struct.unpack_from('<I', data, 8)[0]
              off=12; doc=None
              while off < total:
                  n,typ=struct.unpack_from('<II', data, off)
                  chunk=data[off+8:off+8+n]
                  off += 8+n
                  if typ == 0x4E4F534A: doc=json.loads(chunk.decode('utf-8').rstrip('\x00 '))
              if not doc: raise SystemExit(f'{path}: no JSON chunk')
              tris=0
              for mesh in doc.get('meshes',[]):
                  for p in mesh.get('primitives',[]):
                      if 'indices' in p: tris += doc['accessors'][p['indices']]['count']//3
                      elif 'POSITION' in p.get('attributes',{}): tris += doc['accessors'][p['attributes']['POSITION']]['count']//3
              images=len(doc.get('images',[]))
              print(path, 'triangles=', tris, 'images=', images)
              if tris > 300000: raise SystemExit(f'{path}: exceeds Meshy rigging face ceiling')
              if images < 1: raise SystemExit(f'{path}: no embedded texture image for rigging')
          PY

      - name: Rig Bermuda male and female characters
        shell: bash
        run: |
          set -euo pipefail
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          W="$PWD"
          ROOT="$PWD/.meshy-production/projects"
          mkdir -p "$ROOT" public/models/bermuda/characters .meshy-production/results

          rig_one () {
            local name="$1" src="$2" height="$3"
            echo "===== RIGGING ${name} ====="
            submit=$($M rigging create --model-url "$PWD/$src" --height-meters "$height" --async \
              --output-schema v1 --format json --no-update-check)
            echo "$submit" | tee ".meshy-production/results/${name}-rig-submit.json"
            task=$(echo "$submit" | jq -r '.result.submission.task_id // .result.task_id // .task_id // empty')
            test -n "$task"

            init=$($M project init --root "$ROOT" --name "${name}-rig" --task-id "$task" --task-type rigging \
              --workspace "$W" --output-schema v1 --format json --no-update-check)
            echo "$init" | tee ".meshy-production/results/${name}-rig-project.json"
            project=$(echo "$init" | jq -r '.result.project_dir // .project_dir // empty')
            test -n "$project"

            $M rigging wait "$task" --timeout 1200 --project "$project" --stage rigging --workspace "$W" \
              --output-schema v1 --format json --no-update-check | tee ".meshy-production/results/${name}-rig-wait.json"

            $M download --resource rigging --task-id "$task" --asset result.rigged_character_glb_url \
              --output "public/models/bermuda/characters/${name}-rigged.glb" \
              --project "$project" --stage rigging --workspace "$W" \
              --output-schema v1 --format json --no-update-check
            $M download --resource rigging --task-id "$task" --asset result.basic_animations.walking_glb_url \
              --output "public/models/bermuda/characters/${name}-walk.glb" \
              --project "$project" --stage walking --workspace "$W" \
              --output-schema v1 --format json --no-update-check
            $M download --resource rigging --task-id "$task" --asset result.basic_animations.running_glb_url \
              --output "public/models/bermuda/characters/${name}-run.glb" \
              --project "$project" --stage running --workspace "$W" \
              --output-schema v1 --format json --no-update-check
          }

          rig_one bermuda-player-male public/models/bermuda/street-life/desktop/bermuda-npc-male.glb 1.78
          rig_one bermuda-npc-female public/models/bermuda/street-life/desktop/bermuda-npc-female.glb 1.68

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/bermuda/characters
          git commit -m "asset: add rigged Bermuda character animation set"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final Meshy balance
        if: always()
        shell: bash
        run: |
          M="npm exec --yes --package=meshy-cli@0.4.0 -- meshy"
          $M balance --output-schema v1 --format json --no-update-check | tee .meshy-production/results/balance-after.json || true

      - name: Upload Meshy records and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-production-assets-records
          path: |
            .meshy-production/results/
            .meshy-production/estimates/
            .meshy-production/previews/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
