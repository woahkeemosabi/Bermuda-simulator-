name: Fix Campaign Meshy Budgets

on:
  push:
    branches: [ bermuda-fix-campaign-meshy-budgets ]
    paths:
      - '.github/workflows/fix-campaign-meshy-budgets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-campaign-meshy-budgets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Optimize existing Meshy campaign GLBs to runtime budgets
        shell: bash
        run: |
          set -euo pipefail
          G="npm exec --yes --package=@gltf-transform/cli@4.5.1 -- gltf-transform"
          DIR="public/models/bermuda/campaign/mobile"
          TMP="$(mktemp -d)"

          cp "$DIR/bermuda-blue-hole-component.glb" "$TMP/blue.glb"
          cp "$DIR/bermuda-limestone-door.glb" "$TMP/door.glb"
          cp "$DIR/bermuda-red-room-console.glb" "$TMP/console.glb"

          $G optimize "$TMP/blue.glb" "$DIR/bermuda-blue-hole-component.glb" \
            --simplify true --simplify-ratio 0.09 --simplify-error 0.006 \
            --compress false --texture-compress webp --texture-size 1024

          $G optimize "$TMP/door.glb" "$DIR/bermuda-limestone-door.glb" \
            --simplify true --simplify-ratio 0.18 --simplify-error 0.006 \
            --compress false --texture-compress webp --texture-size 1024

          $G optimize "$TMP/console.glb" "$DIR/bermuda-red-room-console.glb" \
            --simplify true --simplify-ratio 0.05 --simplify-error 0.008 \
            --compress false --texture-compress webp --texture-size 1024

      - name: Prove triangle and texture budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, sys
          assets = {
              'public/models/bermuda/campaign/mobile/bermuda-blue-hole-component.glb': 9000,
              'public/models/bermuda/campaign/mobile/bermuda-limestone-door.glb': 12000,
              'public/models/bermuda/campaign/mobile/bermuda-red-room-console.glb': 9000,
          }
          cmd = ['npm','exec','--yes','--package=@gltf-transform/cli@4.5.1','--','gltf-transform','inspect']
          for path, budget in assets.items():
              out = subprocess.check_output(cmd + [path, '--format', 'csv'], text=True)
              match = re.search(r'^0,,TRIANGLES,1,(\d+),', out, flags=re.M)
              if not match:
                  print(f'Could not read triangle count: {path}', file=sys.stderr)
                  sys.exit(2)
              triangles = int(match.group(1))
              textures = re.findall(r',image/webp,,(\d+)x(\d+),', out)
              max_tex = max((max(map(int, pair)) for pair in textures), default=0)
              size = __import__('os').path.getsize(path)
              print(f'{path}: triangles={triangles}/{budget}, maxTexture={max_tex}/1024, bytes={size}')
              if triangles > budget or max_tex > 1024:
                  print(f'Budget failure: {path}', file=sys.stderr)
                  sys.exit(3)
          PY

      - name: Run game logic tests and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node test/game-logic.mjs
          npm run build

      - name: Commit optimized assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-campaign-meshy-budgets.yml
          git add public/models/bermuda/campaign/mobile/bermuda-blue-hole-component.glb \
                  public/models/bermuda/campaign/mobile/bermuda-limestone-door.glb \
                  public/models/bermuda/campaign/mobile/bermuda-red-room-console.glb
          git commit -m 'Fix late-campaign Meshy runtime budgets'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
