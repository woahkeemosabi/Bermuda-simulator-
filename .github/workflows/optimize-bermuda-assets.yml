name: Optimize Bermuda Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/models/bermuda/*.glb'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install glTF optimizer
        run: npm install --no-save @gltf-transform/cli
      - name: Build mobile and desktop tiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models/bermuda/mobile public/models/bermuda/desktop
          shopt -s nullglob
          files=(public/models/bermuda/*.glb)
          if [ ${#files[@]} -eq 0 ]; then echo 'No Bermuda GLBs found'; exit 1; fi
          for src in "${files[@]}"; do
            base=$(basename "$src")
            echo "Optimizing $base"
            # Desktop: retain source geometry, deduplicate/prune and compress textures.
            npx gltf-transform optimize "$src" "public/models/bermuda/desktop/$base" \
              --compress meshopt --texture-compress webp --texture-size 2048
            # Mobile: simplify geometry aggressively enough for Safari/WebGPU, cap textures at 1K.
            npx gltf-transform optimize "$src" "public/models/bermuda/mobile/$base" \
              --simplify true --simplify-ratio 0.35 --simplify-error 0.001 \
              --compress meshopt --texture-compress webp --texture-size 1024
          done
          echo '--- sizes ---'
          du -h public/models/bermuda/mobile/*.glb public/models/bermuda/desktop/*.glb || true
      - name: Commit optimized tiers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/bermuda/mobile public/models/bermuda/desktop
          git diff --cached --quiet && exit 0
          git commit -m 'assets: generate optimized Bermuda mobile and desktop tiers'
          git push
