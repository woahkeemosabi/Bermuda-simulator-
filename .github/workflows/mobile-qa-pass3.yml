name: Mobile QA Pass 3

on:
  push:
    branches: [ bermuda-mobile-qa-pass3 ]
    paths:
      - '.github/workflows/mobile-qa-pass3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply iPhone QA fixes
        run: node scripts/mobile-qa-pass3.mjs

      - name: Verify source logic and build
        run: |
          git diff --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const game = fs.readFileSync('src/game/Game.js','utf8');
          const lobster = fs.readFileSync('src/game/Lobsters.js','utf8');
          const fixtures = fs.readFileSync('src/game/DockShopFixtures.js','utf8');
          const vendor = fs.readFileSync('src/game/Vendor.js','utf8');
          const mobile = fs.readFileSync('src/mobile/BermudaMobileStable.js','utf8');
          const main = fs.readFileSync('src/main.js','utf8');
          for (const needle of ['lobsterAim', 'Lobster capture recovered']) if (!game.includes(needle)) throw new Error(`Game missing ${needle}`);
          for (const needle of ['const size = 0.58', 'bodyCm: Math.round( 30']) if (!lobster.includes(needle)) throw new Error(`Lobsters missing ${needle}`);
          for (const needle of ["JOE'S", "MARTHA'S", 'BAIT + TACKLE', 'InstancedMesh']) if (!fixtures.includes(needle)) throw new Error(`signage missing ${needle}`);
          if (!vendor.includes('( this.characterYaw || 0 ) + this._yawOff')) throw new Error('vendor facing fix missing');
          if (!mobile.includes('tw-start{background:radial-gradient')) throw new Error('opaque mobile start screen missing');
          if (!main.includes('setTimeout( resolve, 25000 )')) throw new Error('pipeline prep window missing');
          if (!main.includes("Preparing Bermuda scenery")) throw new Error('pre-play scenery staging missing');
          console.log('mobile QA pass 3 source checks passed');
          NODE
          node test/game-logic.mjs
          npm run build

      - name: Commit verified fixes
        run: |
          git config user.name 'bermuda-simulator-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/game/FishStand.js src/game/Chandlery.js src/game/Vendor.js src/game/DockShopFixtures.js src/game/Lobsters.js src/game/Game.js src/mobile/BermudaMobileStable.js src/main.js
          git commit -m 'Fix lobster safety shop signage vendor visibility and startup staging'
          git push origin HEAD:bermuda-mobile-qa-pass3
