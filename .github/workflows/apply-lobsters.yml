name: Apply Underwater Gameplay

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-lobsters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply underwater polish
        run: node scripts/apply-underwater-polish.mjs
      - name: Verify underwater gameplay
        run: |
          git diff --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const game = fs.readFileSync('src/game/Game.js', 'utf8');
          const table = fs.readFileSync('src/game/FishTable.js', 'utf8');
          const state = fs.readFileSync('src/game/GameState.js', 'utf8');
          const lob = fs.readFileSync('src/game/Lobsters.js', 'utf8');
          const spear = fs.readFileSync('src/game/Spear.js', 'utf8');
          const fish = fs.readFileSync('src/world/Fish.js', 'utf8');
          const hud = fs.readFileSync('src/game/GameHUD.js', 'utf8');
          for (const [name, text, needles] of [
            ['Game.js', game, ['UNDERWATER_POLISH_V1', 'this.spear.grab', 'this.spear.impact', "showDiveCatch( info, 'SPEARED' )", 'aiming: rod.equipped || diving']],
            ['FishTable.js', table, ['spinyLobster', 'Panulirus argus']],
            ['GameState.js', state, ['cmOverride']],
            ['Lobsters.js', lob, ['class Lobsters', 'target( origin', 'grab( origin', 'position: new Vector3']],
            ['Spear.js', spear, ['UNDERWATER_POLISH_V1', 'updateBubbles', 'grab( position', 'impact( position', 'UnderwaterHuntFX']],
            ['Fish.js', fish, ['spearRespawn', 'visible recoil', 'non-targetable']],
            ['GameHUD.js', hud, ['gm-dive-catch', 'showDiveCatch( info', 'NEW RECORD · STORED']],
          ]) for (const n of needles) if (!text.includes(n)) throw new Error(`${name} missing ${n}`);
          console.log('underwater polish source checks passed');
          NODE

          node test/game-logic.mjs

          # Hosted Linux runners may have no usable Vulkan/WebGPU adapter. Treat only that exact
          # infrastructure condition as a skip; all actual smoke-test failures still fail CI.
          set +e
          ENGINE_LOG="$(node test/engine-smoke.mjs 2>&1)"
          ENGINE_STATUS=$?
          set -e
          printf '%s\n' "$ENGINE_LOG"
          if [ "$ENGINE_STATUS" -ne 0 ]; then
            printf '%s\n' "$ENGINE_LOG" | grep -Fq 'No WebGPU adapter found.'
            echo '::warning::Headless WebGPU smoke test skipped because this runner has no adapter.'
          fi

          npm run build
      - name: Commit verified implementation
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'bermuda-simulator-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/game/Game.js src/game/GameHUD.js src/game/Lobsters.js src/game/Spear.js src/world/Fish.js
          git commit -m 'Polish underwater hunting feedback'
          git push
